<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --border: #d8dee6;
      --accent: #1f7a8c;
      --accent-soft: #e5f4f7;
      --error: #a33636;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 22px;
      box-shadow: 0 10px 28px rgba(23, 32, 42, 0.08);
    }

    .post-meta,
    .comment-meta {
      color: var(--muted);
      font-size: 14px;
    }

    .post-content {
      margin: 14px 0 0;
      font-size: 20px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .comments {
      margin-top: 28px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .comment {
      border-top: 1px solid var(--border);
      padding: 14px 0;
    }

    .comment:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .comment-content {
      margin: 5px 0 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .notice {
      margin-top: 22px;
      background: var(--accent-soft);
      border: 1px solid #b7dce4;
      border-radius: 8px;
      color: #174b56;
      padding: 12px 14px;
      font-size: 14px;
    }

    .error {
      color: var(--error);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Post</h1>
      <p class="subtitle">Read-only view from an email notification</p>
    </header>

    <section class="panel" id="content" aria-live="polite">
      Loading post...
    </section>
  </main>

  <script>
    const content = document.getElementById("content");
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleString(undefined, {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }

    function renderPost(post) {
      const comments = Array.isArray(post.comments) ? post.comments : [];
      content.innerHTML = "";

      const postMeta = document.createElement("div");
      postMeta.className = "post-meta";
      postMeta.textContent = `Post #${post.id} by user #${post.author_id} ${formatDate(post.created_at)}`;

      const postContent = document.createElement("p");
      postContent.className = "post-content";
      postContent.textContent = post.content;

      const commentsSection = document.createElement("section");
      commentsSection.className = "comments";

      const commentsTitle = document.createElement("h2");
      commentsTitle.textContent = `Comments (${comments.length})`;
      commentsSection.appendChild(commentsTitle);

      if (comments.length === 0) {
        const empty = document.createElement("p");
        empty.className = "comment-meta";
        empty.textContent = "No comments yet.";
        commentsSection.appendChild(empty);
      } else {
        for (const comment of comments) {
          const article = document.createElement("article");
          article.className = "comment";

          const meta = document.createElement("div");
          meta.className = "comment-meta";
          meta.textContent = `User #${comment.user_id} ${formatDate(comment.created_at)}`;

          const text = document.createElement("p");
          text.className = "comment-content";
          text.textContent = comment.content;

          article.append(meta, text);
          commentsSection.appendChild(article);
        }
      }

      const notice = document.createElement("div");
      notice.className = "notice";
      notice.textContent = "This page is read-only. Commenting and liking still require logging in through the app.";

      content.append(postMeta, postContent, commentsSection, notice);
    }

    async function loadPost() {
      if (!token) {
        content.innerHTML = '<p class="error">Missing access token in the link.</p>';
        return;
      }

      const response = await fetch(`/api/posts/public?token=${encodeURIComponent(token)}`);
      if (!response.ok) {
        content.innerHTML = '<p class="error">The post could not be loaded.</p>';
        return;
      }

      renderPost(await response.json());
    }

    loadPost().catch(() => {
      content.innerHTML = '<p class="error">The post could not be loaded.</p>';
    });
  </script>
</body>
</html>
